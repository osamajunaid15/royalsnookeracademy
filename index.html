<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Snooker Academy — POS</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
.cp-app{--ink:#12151C;--muted:#6B7280;--muted-2:#9AA1AC;--border:#E7E9F0;--bg:#F6F7FB;--card:#FFFFFF;
--ok-bg:#E6F7ED;--ok-text:#159A55;--warn-bg:#FEF2DE;--warn-text:#B4740A;--danger-bg:#FCE9E9;--danger-text:#D8383D;
--brass:#DD9A1F;--brass-dark:#B4780F;--felt:#12151C;--danger:#D8383D;--ok:#159A55;
font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);border-radius:16px;overflow:hidden;border:1px solid var(--border);position:relative;}
.cp-app *{box-sizing:border-box;}
.cp-bg-art{display:none;}
.cp-head,.cp-tabs,.cp-body{position:relative;z-index:1;}
.cp-head{background:var(--card);color:var(--ink);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.cp-brand{font-family:'Inter',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1.2;display:flex;align-items:center;gap:8px;}
.cp-brand::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);}
.cp-brand span{color:var(--muted);font-weight:700;}
.cp-clock{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:8px;}
.cp-role-btn{background:var(--card);color:var(--ink);border:1px solid var(--border);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;}
.cp-bell{position:relative;background:var(--card);border:1px solid var(--border);color:var(--ink);border-radius:99px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;padding:0;}
.cp-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 3px;font-weight:700;line-height:1;}
.cp-toasts{position:absolute;top:64px;right:10px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:230px;}
.cp-toast{background:var(--ink);color:#fff;padding:10px 13px;border-radius:10px;font-size:12px;font-weight:500;box-shadow:0 10px 24px rgba(18,21,28,.25);opacity:1;transition:opacity .4s;}
.cp-toast.hide{opacity:0;}
.cp-notif-panel{position:absolute;top:60px;right:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 32px rgba(18,21,28,.14);width:250px;max-height:300px;overflow-y:auto;z-index:65;}
.cp-notif-row{padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;}
.cp-notif-row.unread{background:#FFFBF0;}
.cp-notif-row:hover{background:var(--bg);}
.cp-tabs{display:flex;background:var(--card);overflow-x:auto;border-bottom:1px solid var(--border);padding:0 6px;}
.cp-tab{padding:13px 14px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.cp-tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;}
.cp-body{padding:18px;min-height:320px;background:var(--bg);}
.cp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.cp-h2{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;margin:16px 0 12px;letter-spacing:-.3px;}
.cp-row .cp-h2{margin:0;}
.cp-btn{background:var(--ink);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.cp-btn:active{transform:scale(.97);}
.cp-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border);}
.cp-btn.danger{background:var(--danger);color:#fff;}
.cp-btn.brass{background:var(--brass);color:#2A1D07;}
.cp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cp-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(18,21,28,.04);}
.cp-card.running{border-color:var(--warn-text);box-shadow:0 1px 2px rgba(18,21,28,.04),inset 0 0 0 1px rgba(180,116,10,.15);}
.cp-tname{font-weight:700;font-size:14.5px;letter-spacing:-.1px;}
.cp-cat{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:1px;}
.cp-pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:8px;letter-spacing:.2px;}
.cp-pill.idle{background:var(--ok-bg);color:var(--ok-text);}
.cp-pill.on{background:var(--warn-bg);color:var(--warn-text);}
.cp-pill.paused{background:#F0F1F4;color:var(--muted);}
.cp-unit-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px;font-size:11px;}
.cp-unit-toggle button{border:none;background:none;padding:6px 11px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:600;}
.cp-unit-toggle button.active{background:var(--ink);color:#fff;}
.cp-timer{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;margin:10px 0 3px;color:var(--ink);letter-spacing:-.5px;}
.cp-sub{font-size:12px;color:var(--muted);line-height:1.5;}
.cp-cardbtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.cp-cardbtns .cp-btn{flex:1 1 44%;font-size:12px;padding:9px 6px;}
.cp-empty{text-align:center;padding:34px 10px;color:var(--muted-2);font-size:13px;}
.cp-avail-banner{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:13px;font-weight:500;}
.cp-avail-banner b{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;color:#fff;margin-right:6px;}
.cp-avail-strip{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.cp-avail-chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;white-space:nowrap;border:1px solid var(--border);background:#fff;flex-shrink:0;}
.cp-avail-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cp-avail-chip.free .dot{background:var(--ok-text);}
.cp-avail-chip.free{color:var(--ok-text);border-color:#CDEEDA;background:var(--ok-bg);}
.cp-avail-chip.busy .dot{background:var(--warn-text);}
.cp-avail-chip.busy{color:var(--warn-text);border-color:#F6E1B8;background:var(--warn-bg);}
.cp-items{background:var(--bg);border-radius:10px;padding:8px 11px;margin-top:8px;}
.cp-item-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:4px 0;font-weight:500;}
.cp-item-row:not(:last-child){border-bottom:1px dashed var(--border);}
.cp-field{margin-bottom:12px;}
.cp-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.cp-field input,.cp-field select{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:#fff;color:var(--ink);}
.cp-overlay{position:fixed;inset:0;background:rgba(18,21,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.cp-modal{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:420px;max-height:82vh;overflow-y:auto;}
.cp-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.cp-modal-head h3{font-family:'Inter',sans-serif;margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px;}
.cp-x{background:var(--bg);border:none;font-size:16px;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:8px;}
.cp-list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.cp-tag{font-size:11px;font-weight:700;background:var(--bg);padding:3px 9px;border-radius:7px;color:var(--muted);}
.cp-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
.cp-metric{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(18,21,28,.04);}
.cp-metric b{display:block;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px;line-height:1.15;}
.cp-metric span{font-size:11.5px;color:var(--muted);font-weight:500;}
.cp-cash-banner{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(18,21,28,.04);}
.cp-cash-item{display:flex;align-items:center;gap:9px;flex:1 1 45%;}
.cp-cash-icon{font-size:20px;}
.cp-cash-label{font-size:10px;color:var(--muted-2);font-weight:700;letter-spacing:.4px;}
.cp-cash-value{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;color:var(--ink);}
.cp-period-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px;font-size:11px;margin-left:auto;}
.cp-period-toggle button{border:none;background:none;padding:6px 11px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:600;}
.cp-period-toggle button.active{background:var(--ink);color:#fff;}
.cp-cat-pills{display:flex;gap:7px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.cp-cat-pills button{border:1px solid var(--border);background:#fff;color:var(--muted);padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.cp-cat-pills button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.cp-bill{background:var(--ink);color:#fff;border-radius:14px;padding:18px;font-family:'Inter',sans-serif;font-size:13px;}
.cp-bill .line{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums;}
.cp-bill hr{border:none;border-top:1px dashed rgba(255,255,255,.25);margin:9px 0;}
.cp-qty{display:flex;align-items:center;gap:8px;}
.cp-qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:700;}
.cp-note{font-size:12px;color:var(--muted);text-align:center;padding:10px;}
.cp-split{display:flex;gap:8px;}
.cp-split .cp-field{flex:1;}

</style>
</head>
