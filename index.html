<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Snooker Academy — POS</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
.cp-app{--ink:#12151C;--muted:#6B7280;--muted-2:#9AA1AC;--border:#E7E9F0;--bg:#F6F7FB;--card:#FFFFFF;
--ok-bg:#E6F7ED;--ok-text:#159A55;--warn-bg:#FEF2DE;--warn-text:#B4740A;--danger-bg:#FCE9E9;--danger-text:#D8383D;
--brass:#DD9A1F;--brass-dark:#B4780F;--felt:#12151C;--danger:#D8383D;--ok:#159A55;
font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);border-radius:16px;overflow:hidden;border:1px solid var(--border);position:relative;}
.cp-app *{box-sizing:border-box;}
.cp-bg-art{display:none;}
.cp-head,.cp-tabs,.cp-body{position:relative;z-index:1;}
.cp-head{background:var(--card);color:var(--ink);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.cp-brand{font-family:'Inter',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1.2;display:flex;align-items:center;gap:8px;}
.cp-brand::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);}
.cp-brand span{color:var(--muted);font-weight:700;}
.cp-clock{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:8px;}
.cp-role-btn{background:var(--card);color:var(--ink);border:1px solid var(--border);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;}
.cp-bell{position:relative;background:var(--card);border:1px solid var(--border);color:var(--ink);border-radius:99px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;padding:0;}
.cp-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 3px;font-weight:700;line-height:1;}
.cp-toasts{position:absolute;top:64px;right:10px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:230px;}
.cp-toast{background:var(--ink);color:#fff;padding:10px 13px;border-radius:10px;font-size:12px;font-weight:500;box-shadow:0 10px 24px rgba(18,21,28,.25);opacity:1;transition:opacity .4s;}
.cp-toast.hide{opacity:0;}
.cp-notif-panel{position:absolute;top:60px;right:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 32px rgba(18,21,28,.14);width:250px;max-height:300px;overflow-y:auto;z-index:65;}
.cp-notif-row{padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;}
.cp-notif-row.unread{background:#FFFBF0;}
.cp-notif-row:hover{background:var(--bg);}
.cp-tabs{display:flex;background:var(--card);overflow-x:auto;border-bottom:1px solid var(--border);padding:0 6px;}
.cp-tab{padding:13px 14px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.cp-tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;}
.cp-body{padding:18px;min-height:320px;background:var(--bg);}
.cp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.cp-h2{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;margin:16px 0 12px;letter-spacing:-.3px;}
.cp-row .cp-h2{margin:0;}
.cp-btn{background:var(--ink);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.cp-btn:active{transform:scale(.97);}
.cp-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border);}
.cp-btn.danger{background:var(--danger);color:#fff;}
.cp-btn.brass{background:var(--brass);color:#2A1D07;}
.cp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cp-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(18,21,28,.04);}
.cp-card.running{border-color:var(--warn-text);box-shadow:0 1px 2px rgba(18,21,28,.04),inset 0 0 0 1px rgba(180,116,10,.15);}
.cp-tname{font-weight:700;font-size:14.5px;letter-spacing:-.1px;}
.cp-cat{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:1px;}
.cp-pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:8px;letter-spacing:.2px;}
.cp-pill.idle{background:var(--ok-bg);color:var(--ok-text);}
.cp-pill.on{background:var(--warn-bg);color:var(--warn-text);}
.cp-pill.paused{background:#F0F1F4;color:var(--muted);}
.cp-unit-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px;font-size:11px;}
.cp-unit-toggle button{border:none;background:none;padding:6px 11px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:600;}
.cp-unit-toggle button.active{background:var(--ink);color:#fff;}
.cp-timer{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;margin:10px 0 3px;color:var(--ink);letter-spacing:-.5px;}
.cp-sub{font-size:12px;color:var(--muted);line-height:1.5;}
.cp-cardbtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.cp-cardbtns .cp-btn{flex:1 1 44%;font-size:12px;padding:9px 6px;}
.cp-empty{text-align:center;padding:34px 10px;color:var(--muted-2);font-size:13px;}
.cp-avail-banner{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:13px;font-weight:500;}
.cp-avail-banner b{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;color:#fff;margin-right:6px;}
.cp-avail-strip{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.cp-avail-chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;white-space:nowrap;border:1px solid var(--border);background:#fff;flex-shrink:0;}
.cp-avail-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cp-avail-chip.free .dot{background:var(--ok-text);}
.cp-avail-chip.free{color:var(--ok-text);border-color:#CDEEDA;background:var(--ok-bg);}
.cp-avail-chip.busy .dot{background:var(--warn-text);}
.cp-avail-chip.busy{color:var(--warn-text);border-color:#F6E1B8;background:var(--warn-bg);}
.cp-items{background:var(--bg);border-radius:10px;padding:8px 11px;margin-top:8px;}
.cp-item-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:4px 0;font-weight:500;}
.cp-item-row:not(:last-child){border-bottom:1px dashed var(--border);}
.cp-field{margin-bottom:12px;}
.cp-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.cp-field input,.cp-field select{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:#fff;color:var(--ink);}
.cp-overlay{position:fixed;inset:0;background:rgba(18,21,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.cp-modal{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:420px;max-height:82vh;overflow-y:auto;}
.cp-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.cp-modal-head h3{font-family:'Inter',sans-serif;margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px;}
.cp-x{background:var(--bg);border:none;font-size:16px;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:8px;}
.cp-list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.cp-tag{font-size:11px;font-weight:700;background:var(--bg);padding:3px 9px;border-radius:7px;color:var(--muted);}
.cp-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
.cp-metric{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(18,21,28,.04);}
.cp-metric b{display:block;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px;line-height:1.15;}
.cp-metric span{font-size:11.5px;color:var(--muted);font-weight:500;}
.cp-cash-banner{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(18,21,28,.04);}
.cp-cash-item{display:flex;align-items:center;gap:9px;flex:1 1 45%;}
.cp-cash-icon{font-size:20px;}
.cp-cash-label{font-size:10px;color:var(--muted-2);font-weight:700;letter-spacing:.4px;}
.cp-cash-value{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;color:var(--ink);}
.cp-period-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px;font-size:11px;margin-left:auto;}
.cp-period-toggle button{border:none;background:none;padding:6px 11px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:600;}
.cp-period-toggle button.active{background:var(--ink);color:#fff;}
.cp-cat-pills{display:flex;gap:7px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.cp-cat-pills button{border:1px solid var(--border);background:#fff;color:var(--muted);padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.cp-cat-pills button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.cp-bill{background:var(--ink);color:#fff;border-radius:14px;padding:18px;font-family:'Inter',sans-serif;font-size:13px;}
.cp-bill .line{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums;}
.cp-bill hr{border:none;border-top:1px dashed rgba(255,255,255,.25);margin:9px 0;}
.cp-qty{display:flex;align-items:center;gap:8px;}
.cp-qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:700;}
.cp-note{font-size:12px;color:var(--muted);text-align:center;padding:10px;}
.cp-split{display:flex;gap:8px;}
.cp-split .cp-field{flex:1;}

</style>
</head>
<body>

<script>
(function(){
/* --- Remote kill-switch --- */
(function(){
  var cfgUrl='config.json?_='+Date.now();
  try{
    var x=new XMLHttpRequest();
    x.open('GET',cfgUrl,false);
    x.send();
    if(x.status===200){
      var c=JSON.parse(x.responseText);
      if(c.active===false||(c.expiry&&new Date(c.expiry)<new Date())){
        document.getElementById('cpApp').innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:400px;padding:40px;text-align:center;"><div><div style="font-size:48px;margin-bottom:16px;">&#128274;</div><h2 style="margin:0 0 8px;font-family:Inter,sans-serif;">Demo Period Ended</h2><p style="color:#6B7280;font-size:14px;max-width:300px;margin:0 auto;">'+(c.message||'This demo has expired. Contact the developer for a full license.')+'</p></div></div>';
        return;
      }
    }
  }catch(e){}
})();
/* --- Firebase init --- */
firebase.initializeApp({
  apiKey:"AIzaSyAxkJ3bJKgswpz8ggmfa7Oetn99mSCXrT0",
  authDomain:"royal-snooker-academy.firebaseapp.com",
  databaseURL:"https://royal-snooker-academy-default-rtdb.firebaseio.com",
  projectId:"royal-snooker-academy",
  storageBucket:"royal-snooker-academy.firebasestorage.app",
  messagingSenderId:"765677194573",
  appId:"1:765677194573:web:55c739eec3daf785803b04"
});
var db=firebase.database();
var STORE_KEY='club-state-v1';
var BOOKING_KEY='sns-bookings-v1';
var LS_STATE='rsa-state';
var LS_BOOKINGS='rsa-bookings';
var firebaseOk=false;
var state=null;
var bookings=[];
var role='staff';
var rateUnit='min';
var timerHandle=null;
var VALID_TABS=['tables','bookings','khata','canteen','finance','history','income','customertabs','admin'];
var activeTab=(function(){
  var h=(location.hash||'').replace('#','');
  return VALID_TABS.indexOf(h)>=0 ? h : 'tables';
})();
var knownBookingIds=new Set();
var notifPollHandle=null;
var categoryFilter='all';
var cashPeriod='today';
var showAllCategoryMetrics=false;

function mkStation(id,name,category,mode,regHour,peakHour,regMin,peakMin){
  if(!regHour && regMin) regHour=Math.round(regMin*60*100)/100;
  if(!peakHour && peakMin) peakHour=Math.round(peakMin*60*100)/100;
  if(!regMin && regHour) regMin=Math.round((regHour/60)*100)/100;
  if(!peakMin && peakHour) peakMin=Math.round((peakHour/60)*100)/100;
  return {id:id,name:name,category:category,mode:mode,
    regularRateHour:regHour,peakRateHour:peakHour,regularRateMin:regMin,peakRateMin:peakMin,
    peakStart:'18:00',peakEnd:'23:00',status:'idle',startTime:null,customer:'',orders:[],
    sessionMode:null,gameLog:[],pausedMs:0,pauseStart:null,
    bookingId:null,bookingAdvance:0,bookingCustomerName:'',bookingCustomerPhone:''};
}
function defaultState(){
  return {
    stations:[
      mkStation('t1','Table 1','Snooker','hour',400,600,0,0),
      mkStation('t2','Table 2','Snooker','both',400,600,7,10),
      mkStation('t3','8-Ball 1','8-Ball Pool','hour',300,450,0,0),
      mkStation('t4','PS5 Bay 1','PS5','min',0,0,5,7),
      mkStation('t5','PS5 Bay 2','PS5','min',0,0,5,7)
    ],
    products:[
      {id:'p1',name:'Chai',price:60,stock:40},
      {id:'p2',name:'Cold Drink',price:120,stock:30},
      {id:'p3',name:'Chips',price:100,stock:25},
      {id:'p4',name:'Water Bottle',price:50,stock:50}
    ],
    khata:[],
    khataRequests:[],
    sales:[],
    invoiceCounter:1,
    settings:{adminPin:'1234',khataNeedsApproval:true,minBookingAdvance:500,ownerPassword:'owner123'},
    register:{current:null,history:[]},
    customerTabs:[]
  };
}

function lsGet(key){try{var d=localStorage.getItem(key);return d?JSON.parse(d):null;}catch(e){return null;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function showFirebaseError(msg){
  var bar=document.getElementById('fbErrBar');
  if(!bar){
    bar=document.createElement('div');
    bar.id='fbErrBar';
    bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#D8383D;color:#fff;padding:10px 14px;font-size:13px;font-weight:600;text-align:center;font-family:Inter,sans-serif;';
    document.body.appendChild(bar);
  }
  bar.textContent='⚠ Firebase: '+msg+' — Data sirf local save ho raha hai. Firebase Console mein Rules check karein.';
  bar.style.display='block';
}
async function loadState(){
  var fromFb=false;
  try{
    var snap=await db.ref('state').once('value');
    var fbData=snap.val();
    if(fbData){
      state=fbData;
      fromFb=true;
      firebaseOk=true;
      lsSet(LS_STATE,state);
    } else {
      /* Firebase connected but empty — try localStorage */
      state=lsGet(LS_STATE)||defaultState();
      firebaseOk=true;
    }
  }catch(e){
    firebaseOk=false;
    state=lsGet(LS_STATE)||defaultState();
    showFirebaseError('Read failed — '+((e&&e.message)||'permission denied'));
  }
  if(!state.settings) state.settings={adminPin:'1234',khataNeedsApproval:true};
  if(!state.khataRequests) state.khataRequests=[];
  state.stations.forEach(function(st){
    if(!st.gameLog) st.gameLog=[];
    if(st.pausedMs==null) st.pausedMs=0;
    if(st.pauseStart===undefined) st.pauseStart=null;
    if(st.bookingId===undefined) st.bookingId=null;
    if(st.bookingAdvance==null) st.bookingAdvance=0;
    if(st.bookingCustomerName===undefined) st.bookingCustomerName='';
    if(st.bookingCustomerPhone===undefined) st.bookingCustomerPhone='';
    st.gameLog.forEach(function(g){
      if(g.customerTabId===undefined) g.customerTabId=null;
      if(g.paidOffByTab===undefined) g.paidOffByTab=false;
    });
  });
  if(!state.settings.minBookingAdvance && state.settings.minBookingAdvance!==0) state.settings.minBookingAdvance=500;
  if(!state.settings.ownerPassword) state.settings.ownerPassword='owner123';
  if(!state.register) state.register={current:null,history:[]};
  if(!state.customerTabs) state.customerTabs=[];
  publishStations();
  publishSettings();
  await loadBookings();
  bookings.forEach(function(b){
    if(b.notifRead===undefined) b.notifRead=true;
    if(b.consumed===undefined) b.consumed=false;
    if(b.advanceAmount===undefined) b.advanceAmount=0;
  });
  saveBookings();
  knownBookingIds=new Set(bookings.map(function(b){return b.id;}));
  startNotifPolling();
  render();
}
function saveState(){
  lsSet(LS_STATE,state);
  db.ref('state').set(state).then(function(){
    firebaseOk=true;
    var bar=document.getElementById('fbErrBar');
    if(bar) bar.style.display='none';
  }).catch(function(e){
    firebaseOk=false;
    showFirebaseError('Write failed — '+((e&&e.message)||'permission denied'));
  });
  publishStations();
  publishSettings();
}
function publishSettings(){
  db.ref('settings-public').set({minBookingAdvance:state.settings.minBookingAdvance||0}).catch(function(){});
}
function publishStations(){
  try{
    var pub=state.stations.map(function(s){return {id:s.id,name:s.name,category:s.category,status:s.status};});
    db.ref('stations-public').set(pub).catch(function(){});
  }catch(e){}
}

function fmtMoney(n){ return 'Rs. '+Math.round(n).toLocaleString(); }
function fmtDur(sec){
  sec=Math.max(0,Math.floor(sec));
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return (h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtTime12(d){
  var h=d.getHours(), m=d.getMinutes();
  var ap=h>=12?'PM':'AM';
  var h12=h%12; if(h12===0) h12=12;
  return (h12<10?'0'+h12:h12)+':'+(m<10?'0'+m:m)+' '+ap;
}
function isPeakAt(st,date){
  var cur=date.getHours()*60+date.getMinutes();
  var toMin=function(t){var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);};
  var s=toMin(st.peakStart), e=toMin(st.peakEnd);
  if(s<=e) return cur>=s && cur<e;
  return cur>=s || cur<e;
}
function isPeakNow(st){ return isPeakAt(st,new Date()); }
function billingMode(st){ return st.mode==='both' ? (st.sessionMode||'hour') : st.mode; }
function rateAt(st,date){
  var bm=billingMode(st), peak=isPeakAt(st,date);
  if(bm==='min') return peak?st.peakRateMin:st.regularRateMin;
  return peak?st.peakRateHour:st.regularRateHour;
}
function currentRate(st){ return rateAt(st,new Date()); }
function rateLabel(st){ return billingMode(st)==='min'?'/min':'/hr'; }
function costForDuration(st,rate,durationSec){
  var mins=durationSec/60;
  return billingMode(st)==='hour' ? (rate/60)*mins : rate*mins;
}
function elapsedSec(st){
  if(!st.startTime) return 0;
  var now=Date.now();
  var pausedTotalMs=(st.pausedMs||0)+(st.pauseStart?(now-st.pauseStart):0);
  return Math.max(0,(now-st.startTime-pausedTotalMs)/1000);
}
function loggedSoFar(st){ return (st.gameLog||[]).reduce(function(a,g){return a+g.durationSec;},0); }
function gameCost(st){
  var logged=loggedSoFar(st);
  var total=elapsedSec(st);
  var openDur=Math.max(0,total-logged);
  var loggedCost=(st.gameLog||[]).reduce(function(a,g){return a+costForDuration(st,rateAt(st,new Date(g.startedAt)),g.durationSec);},0);
  var openCost=costForDuration(st,currentRate(st),openDur);
  return loggedCost+openCost;
}
function canteenTotal(st){
  var t=0;
  st.orders.forEach(function(o){
    var p=state.products.find(function(x){return x.id===o.pid;});
    if(p) t+=p.price*o.qty;
  });
  return t;
}

function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }

function renderRoleBtn(){
  var b=document.getElementById('cpRoleBtn');
  b.textContent = role==='admin' ? '\u2713 Admin mode' : 'Staff mode';
  b.onclick=function(){
    if(role==='admin'){ role='staff'; if(activeTab==='admin') activeTab='tables'; render(); return; }
    var pin=prompt('Enter admin PIN to switch to admin mode:');
    if(pin===null) return;
    if(pin===state.settings.adminPin){ role='admin'; render(); }
    else alert('Incorrect PIN.');
  };
}
function showToast(msg){
  var container=document.getElementById('cpToasts');
  if(!container) return;
  var t=el('div','cp-toast',msg);
  container.appendChild(t);
  setTimeout(function(){
    t.classList.add('hide');
    setTimeout(function(){ t.remove(); },400);
  },5000);
}
function renderBell(){
  var badge=document.getElementById('cpBadge');
  if(!badge) return;
  var unread=bookings.filter(function(b){return !b.notifRead;}).length;
  if(unread>0){ badge.textContent=unread>9?'9+':unread; badge.style.display='flex'; }
  else { badge.style.display='none'; }
  var bellBtn=document.getElementById('cpBell');
  if(bellBtn) bellBtn.onclick=toggleNotifPanel;
}
function toggleNotifPanel(){
  var existing=document.getElementById('cpNotifPanel');
  if(existing){ existing.remove(); return; }
  var panel=el('div','cp-notif-panel'); panel.id='cpNotifPanel';
  var sorted=bookings.slice().sort(function(a,b){return b.createdAt-a.createdAt;}).slice(0,12);
  if(!sorted.length){ panel.appendChild(el('div','cp-empty','No notifications yet.')); }
  sorted.forEach(function(b){
    var row=el('div','cp-notif-row'+(b.notifRead?'':' unread'),
      '<div class="cp-tname" style="font-size:13px;">'+b.name+'</div><div class="cp-sub">'+(b.category||'')+' · '+(b.date||'')+' '+(b.time||'')+'</div>');
    row.onclick=function(){
      b.notifRead=true;
      saveBookings();
      panel.remove();
      goTab('bookings');
    };
    panel.appendChild(row);
  });
  document.getElementById('cpApp').appendChild(panel);
}
function startNotifPolling(){
  db.ref('bookings').on('value',function(snap){
    try{
      var latest=snap.val()||[];
      var newOnes=latest.filter(function(b){return !knownBookingIds.has(b.id);});
      bookings=latest;
      newOnes.forEach(function(b){
        knownBookingIds.add(b.id);
        showToast('New booking: '+b.name+' — '+(b.category||'')+' '+(b.date||'')+' '+(b.time||''));
      });
      renderBell();
      if(activeTab==='bookings') render();
    }catch(e){}
  });
}
function goTab(id){
  activeTab=id;
  try{ history.replaceState(null,'','#'+id); }catch(e){ location.hash=id; }
  if(id==='bookings'){ loadBookings().then(render); } else render();
}
function renderTabs(){
  var allTabs=[['tables','Live Tables'],['bookings','Bookings'],['khata','Khata'],['canteen','Canteen'],['finance','Finance'],['history','Sales History'],['income','Income'],['customertabs','Customer Tabs'],['admin','Admin']];
  var tabs = role==='admin' ? allTabs : allTabs.filter(function(t){return t[0]!=='admin';});
  if(role!=='admin' && activeTab==='admin') activeTab='tables';
  var box=document.getElementById('cpTabs'); box.innerHTML='';
  tabs.forEach(function(t){
    var b=el('button','cp-tab'+(activeTab===t[0]?' active':''),t[1]);
    b.onclick=function(){ goTab(t[0]); };
    box.appendChild(b);
  });
  renderRoleBtn();
  renderBell();
}

function render(){
  renderTabs();
  var body=document.getElementById('cpBody');
  body.innerHTML='';
  if(activeTab==='tables') renderTables(body);
  else if(activeTab==='khata') renderKhata(body);
  else if(activeTab==='canteen') renderCanteen(body);
  else if(activeTab==='history') renderHistory(body);
  else if(activeTab==='income') renderIncome(body);
  else if(activeTab==='admin') renderAdmin(body);
  else if(activeTab==='bookings') renderBookings(body);
  else if(activeTab==='finance') renderFinance(body);
  else if(activeTab==='customertabs') renderCustomerTabs(body);
}

function renderAvailability(body){
  var total=state.stations.length;
  var free=state.stations.filter(function(s){return s.status==='idle';}).length;
  var banner=el('div','cp-avail-banner','<b>'+free+' of '+total+'</b> tables free right now');
  body.appendChild(banner);
  if(total){
    var strip=el('div','cp-avail-strip');
    state.stations.forEach(function(st){
      var isFree=st.status==='idle';
      strip.appendChild(el('div','cp-avail-chip '+(isFree?'free':'busy'),'<span class="dot"></span>'+st.name+(isFree?' — free':' — busy')));
    });
    body.appendChild(strip);
  }
}

function isToday(ts){
  var d=new Date(ts), t=new Date();
  return d.toDateString()===t.toDateString();
}
function renderCashBanner(body){
  var sales = cashPeriod==='today' ? state.sales.filter(function(s){return isToday(s.end);}) : state.sales;
  var cash = sales.reduce(function(a,s){return a+s.cash;},0);
  var online = sales.reduce(function(a,s){return a+s.online;},0);
  var wrap=el('div','cp-cash-banner');
  wrap.innerHTML =
    '<div class="cp-cash-item"><span class="cp-cash-icon">\uD83D\uDCB5</span><div><div class="cp-cash-label">CASH RECEIVED</div><div class="cp-cash-value">'+fmtMoney(cash)+'</div></div></div>'+
    '<div class="cp-cash-item"><span class="cp-cash-icon">\uD83D\uDCF1</span><div><div class="cp-cash-label">ONLINE RECEIVED</div><div class="cp-cash-value">'+fmtMoney(online)+'</div></div></div>';
  var toggle=el('div','cp-period-toggle');
  var t1=el('button','',"Today"); t1.className=cashPeriod==='today'?'active':'';
  t1.onclick=function(){ cashPeriod='today'; render(); };
  var t2=el('button','',"All time"); t2.className=cashPeriod==='all'?'active':'';
  t2.onclick=function(){ cashPeriod='all'; render(); };
  toggle.appendChild(t1); toggle.appendChild(t2);
  wrap.appendChild(toggle);
  body.appendChild(wrap);
}
function renderCategoryMetrics(body){
  var categories=[];
  state.stations.forEach(function(s){ if(categories.indexOf(s.category)===-1) categories.push(s.category); });
  var total=state.stations.length;
  var activeTotal=state.stations.filter(function(s){return s.status==='running';}).length;
  var cards=[{label:'TOTAL STATIONS',sub:'Total stations active in lounge',value:activeTotal+' / '+total}];
  categories.forEach(function(cat){
    var catStations=state.stations.filter(function(s){return s.category===cat;});
    var occ=catStations.filter(function(s){return s.status==='running';}).length;
    cards.push({label:cat.toUpperCase()+' IN-USE',sub:'Total '+cat+' stations occupied',value:occ+' / '+catStations.length});
  });
  var visibleCount = showAllCategoryMetrics ? cards.length : Math.min(4,cards.length);
  var grid=el('div','cp-metrics');
  for(var i=0;i<visibleCount;i++){
    grid.appendChild(el('div','cp-metric','<b>'+cards[i].value+'</b><span style="display:block;font-weight:600;color:var(--ink);font-size:11px;letter-spacing:.3px;margin-bottom:2px;">'+cards[i].label+'</span><span>'+cards[i].sub+'</span>'));
  }
  body.appendChild(grid);
  if(cards.length>4){
    var toggleBtn=el('button','cp-btn ghost', showAllCategoryMetrics ? 'Show less categories' : 'View all categories ('+(cards.length-4)+' more)');
    toggleBtn.style.cssText='width:100%;margin-bottom:14px;font-size:12px;';
    toggleBtn.onclick=function(){ showAllCategoryMetrics=!showAllCategoryMetrics; render(); };
    body.appendChild(toggleBtn);
  }
}
function renderCategoryPills(body){
  var categories=[];
  state.stations.forEach(function(s){ if(categories.indexOf(s.category)===-1) categories.push(s.category); });
  var wrap=el('div','cp-cat-pills');
  var allBtn=el('button','',"All Stations"); allBtn.className=categoryFilter==='all'?'active':'';
  allBtn.onclick=function(){ categoryFilter='all'; render(); };
  wrap.appendChild(allBtn);
  categories.forEach(function(cat){
    var b=el('button','',cat); b.className=categoryFilter===cat?'active':'';
    b.onclick=function(){ categoryFilter=cat; render(); };
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
}
function renderUnitToggle(){
  var wrap=el('div','cp-unit-toggle');
  var hourBtn=el('button','',rateUnit==='hour'?'Hour':'Hour');
  hourBtn.className=rateUnit==='hour'?'active':'';
  hourBtn.onclick=function(){ rateUnit='hour'; render(); };
  var minBtn=el('button','',rateUnit==='min'?'Minute':'Minute');
  minBtn.className=rateUnit==='min'?'active':'';
  minBtn.onclick=function(){ rateUnit='min'; render(); };
  wrap.appendChild(hourBtn); wrap.appendChild(minBtn);
  return wrap;
}

function renderTables(body){
  renderCashBanner(body);
  renderCategoryMetrics(body);
  renderAvailability(body);
  renderCategoryPills(body);
  var row=el('div','cp-row');
  row.appendChild(el('h2','cp-h2','Live tables & arenas'));
  var rightWrap=el('div',''); rightWrap.style.cssText='display:flex;align-items:center;gap:8px;';
  rightWrap.appendChild(renderUnitToggle());
  if(role==='admin'){
    var addBtn=el('button','cp-btn brass','+ Add table');
    addBtn.onclick=openAddStation;
    rightWrap.appendChild(addBtn);
  }
  row.appendChild(rightWrap);
  body.appendChild(row);
  body.appendChild(el('div','cp-note','Rate display: '+(rateUnit==='hour'?'per hour':'per minute')+' (for reference only — actual billing uses each table\u2019s configured mode).'));

  var grid=el('div','cp-grid');
  var visibleStations = categoryFilter==='all' ? state.stations : state.stations.filter(function(s){return s.category===categoryFilter;});
  visibleStations.forEach(function(st){
    var running=st.status==='running';
    var card=el('div','cp-card'+(running?' running':''));
    var top=el('div','',
      '<div class="cp-tname">'+st.name+'</div><div class="cp-cat">'+st.category+'</div>');
    card.appendChild(top);
    card.appendChild(el('span','cp-pill '+(running?'on':'idle'), running?'Running':'Idle'));
    if(running && st.pauseStart) card.appendChild(el('span','cp-pill paused','Paused'));
    if(running){
      var tm=el('div','cp-timer'); tm.id='timer-'+st.id;
      card.appendChild(tm);
      var costLine=el('div','cp-sub'); costLine.id='cost-'+st.id;
      costLine.innerHTML='Rate: '+fmtMoney(currentRate(st))+rateLabel(st)+(isPeakNow(st)?' · peak':'')+' · Running: <b style="color:var(--felt);">'+fmtMoney(gameCost(st))+'</b>';
      card.appendChild(costLine);
      if(st.gameLog.length){
        var gamesBox=el('div','cp-items'); gamesBox.id='games-'+st.id;
        card.appendChild(gamesBox);
        renderGameLogItems(gamesBox,st);
      }
      if(st.orders.length){
        var itemsBox=el('div','cp-items'); itemsBox.id='items-'+st.id;
        card.appendChild(itemsBox);
        renderOrderItems(itemsBox,st);
      }
      var grandLine=el('div','cp-sub'); grandLine.id='grand-'+st.id;
      grandLine.style.fontWeight='600'; grandLine.style.marginTop='4px';
      grandLine.textContent='Bill so far: '+fmtMoney(gameCost(st)+canteenTotal(st));
      card.appendChild(grandLine);
      if(st.bookingAdvance>0){
        card.appendChild(el('div','cp-sub','Advance already paid: '+fmtMoney(st.bookingAdvance)+' (adjusted at settle)'));
      }
      var btns=el('div','cp-cardbtns');
      var pauseBtn=el('button','cp-btn ghost',st.pauseStart?'Resume':'Pause');
      pauseBtn.onclick=function(){ togglePause(st.id); };
      var offBtn=el('button','cp-btn ghost','On/Off');
      offBtn.onclick=function(){ openGameOff(st.id); };
      var addItemBtn=el('button','cp-btn ghost','+ Items');
      addItemBtn.onclick=function(){ openStationOrders(st.id); };
      var stopBtn=el('button','cp-btn danger','Settle & bill');
      stopBtn.onclick=function(){ openBill(st.id); };
      btns.appendChild(pauseBtn); btns.appendChild(offBtn); btns.appendChild(addItemBtn); btns.appendChild(stopBtn);
      card.appendChild(btns);
    } else {
      var rateSub = rateUnit==='hour'
        ? ('Regular '+fmtMoney(st.regularRateHour)+' · Peak '+fmtMoney(st.peakRateHour)+' /hr')
        : ('Regular '+fmtMoney(st.regularRateMin)+' · Peak '+fmtMoney(st.peakRateMin)+' /min');
      card.appendChild(el('div','cp-sub',rateSub));
      var btns2=el('div','cp-cardbtns');
      var startBtn=el('button','cp-btn','Start');
      startBtn.style.flex='1 1 100%';
      startBtn.onclick=function(){ openStart(st.id); };
      btns2.appendChild(startBtn);
      card.appendChild(btns2);
    }
    grid.appendChild(card);
  });
  body.appendChild(grid);
  if(!visibleStations.length) body.appendChild(el('div','cp-empty', state.stations.length? 'No tables in this category.' : 'No tables yet. Add one to get started.'));
  startTicking();
}

function renderOrderItems(box,st){
  box.innerHTML='';
  st.orders.forEach(function(o){
    var p=state.products.find(function(x){return x.id===o.pid;});
    if(!p) return;
    box.appendChild(el('div','cp-item-row','<span>'+p.name+' × '+o.qty+'</span><span>'+fmtMoney(p.price*o.qty)+'</span>'));
  });
}
function renderGameLogItems(box,st){
  box.innerHTML='';
  st.gameLog.forEach(function(g,i){
    var tabTag='';
    if(g.customerTabId){
      var ct=state.customerTabs.find(function(t){return t.id===g.customerTabId;});
      tabTag = g.paidOffByTab
        ? ' <span style="color:var(--ok);font-size:10px;">(paid — '+(ct?ct.name:'tab')+')</span>'
        : ' <span style="color:var(--brass);font-size:10px;">(tab: '+(ct?ct.name:'?')+')</span>';
    }
    box.appendChild(el('div','cp-item-row','<span>Game '+(i+1)+' — '+g.name+tabTag+'</span><span>'+fmtDur(g.durationSec)+'</span>'));
  });
}
function startTicking(){
  if(timerHandle) clearInterval(timerHandle);
  timerHandle=setInterval(function(){
    state.stations.filter(function(s){return s.status==='running';}).forEach(function(st){
      var e=document.getElementById('timer-'+st.id);
      if(e) e.textContent=fmtDur(elapsedSec(st));
      var c=document.getElementById('cost-'+st.id);
      if(c) c.innerHTML='Rate: '+fmtMoney(currentRate(st))+rateLabel(st)+(isPeakNow(st)?' · peak':'')+' · Running: <b style="color:var(--felt);">'+fmtMoney(gameCost(st))+'</b>';
      var g=document.getElementById('grand-'+st.id);
      if(g) g.textContent='Bill so far: '+fmtMoney(gameCost(st)+canteenTotal(st));
    });
    var clk=document.getElementById('cpClock');
    if(clk) clk.textContent=new Date().toLocaleTimeString();
  },1000);
}

function togglePause(id){
  var st=state.stations.find(function(s){return s.id===id;});
  if(st.pauseStart){ st.pausedMs=(st.pausedMs||0)+(Date.now()-st.pauseStart); st.pauseStart=null; }
  else { st.pauseStart=Date.now(); }
  saveState(); render();
}

function openGameOff(id){
  var st=state.stations.find(function(s){return s.id===id;});
  var openTabs=state.customerTabs.filter(function(ct){return ct.status==='open';});
  var tabOptions='<option value="">— No tab (table pe hi rahega)</option>';
  openTabs.forEach(function(ct){
    tabOptions+='<option value="'+ct.id+'">'+ct.name+' (Tab #'+ct.id.slice(-4)+')</option>';
  });
  tabOptions+='<option value="__new__">+ Naya tab kholein (auto-create)</option>';
  var tabSelectHtml='<div class="cp-field"><label>Customer tab se link karein? (optional)</label><select id="mOffTab">'+tabOptions+'</select></div>';

  showModal('On / Off — '+st.name,
    '<div class="cp-sub" style="margin-bottom:10px;">Jab ek game khatam ho, jis customer ke naam par yeh game "off" karni hai woh likhein — pichla game record ho jayega aur agla game turant shuru ho jayega (meter chalta rahega).</div>'+
    '<div class="cp-field"><label>Off kis naam par karna hai?</label><input id="mOffName" placeholder="e.g. Zaid"></div>'+
    tabSelectHtml,
    function(){
      var name=document.getElementById('mOffName').value.trim();
      if(!name) return;
      var logged=loggedSoFar(st);
      var total=elapsedSec(st);
      var segDuration=Math.max(0,total-logged);
      var segStart=Date.now()-segDuration*1000;
      var segCost=costForDuration(st,rateAt(st,new Date(segStart)),segDuration);
      var tabSelect=document.getElementById('mOffTab');
      var tabId=tabSelect?tabSelect.value:'';
      if(tabId==='__new__'){
        var newTab={id:'ct'+Date.now(),name:name,phone:'',status:'open',games:[],settledAt:null,totalPaid:0};
        state.customerTabs.push(newTab);
        tabId=newTab.id;
      }
      var gameEntry={name:name,durationSec:segDuration,startedAt:segStart,endedAt:Date.now(),customerTabId:tabId||null,paidOffByTab:false};
      st.gameLog.push(gameEntry);
      if(tabId){
        var tab=state.customerTabs.find(function(ct){return ct.id===tabId;});
        if(tab){
          tab.games.push({stationId:st.id,stationName:st.name,gameName:name,durationSec:segDuration,cost:segCost,startedAt:segStart,endedAt:Date.now(),gameIndex:st.gameLog.length-1});
        }
      }
      saveState(); closeModal(); render();
    },'Save & start next game');
}

function readStationForm(target){
  target.name=document.getElementById('mName').value.trim();
  target.category=document.getElementById('mCat').value||'General';
  target.mode=document.getElementById('mType').value;
  target.regularRateHour=+document.getElementById('mRegH').value||0;
  target.peakRateHour=+document.getElementById('mPeakH').value||0;
  target.regularRateMin=+document.getElementById('mRegM').value||0;
  target.peakRateMin=+document.getElementById('mPeakM').value||0;
  target.peakStart=document.getElementById('mPeakStart').value||'18:00';
  target.peakEnd=document.getElementById('mPeakEnd').value||'23:00';
}
function openAddStation(){
  showModal('Add table',stationFormHtml(null),function(){
    var name=document.getElementById('mName').value.trim();
    if(!name) return;
    var st={id:'t'+Date.now(),status:'idle',startTime:null,customer:'',orders:[],sessionMode:null,gameLog:[],pausedMs:0,pauseStart:null};
    readStationForm(st);
    state.stations.push(st);
    saveState(); closeModal(); render();
  },'Save table');
}
function openEditStation(id){
  var st=state.stations.find(function(s){return s.id===id;});
  showModal('Edit table — '+st.name,stationFormHtml(st),function(){
    readStationForm(st);
    saveState(); closeModal(); render();
  },'Save changes');
}
function deleteStation(id){
  var st=state.stations.find(function(s){return s.id===id;});
  if(st.status==='running'){ alert('Stop and bill this table before deleting it.'); return; }
  if(!confirm('Delete '+st.name+'? This cannot be undone.')) return;
  state.stations=state.stations.filter(function(s){return s.id!==id;});
  saveState(); render();
}

function openStart(id){
  var st=state.stations.find(function(s){return s.id===id;});
  var modeField = st.mode==='both'
    ? '<div class="cp-field"><label>Bill this session by</label><select id="mSessMode"><option value="min">Per minute ('+fmtMoney(isPeakNow(st)?st.peakRateMin:st.regularRateMin)+'/min)</option><option value="hour">Per hour ('+fmtMoney(isPeakNow(st)?st.peakRateHour:st.regularRateHour)+'/hr)</option></select></div>'
    : '';
  var now=new Date();
  var defaultTimeVal=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

function findOrCreateCustomer(name,phone){
  var cust=state.khata.find(function(k){return k.name.toLowerCase()===name.toLowerCase();});
  if(!cust){ cust={id:'k'+Date.now(),name:name,phone:phone||'',given:0,paid:0}; state.khata.push(cust); }
  return cust;
}
function requestOrGrantKhata(name,phone,amount,context){
  if(role==='admin' || !state.settings.khataNeedsApproval){
    var cust=findOrCreateCustomer(name,phone);
    cust.given+=amount;
    return 'approved';
  }
  state.khataRequests.push({id:'r'+Date.now(),name:name,phone:phone||'',amount:amount,context:context,status:'pending',createdAt:Date.now()});
  return 'pending';
}

function openBill(id){
  var st=state.stations.find(function(s){return s.id===id;});
  var now=Date.now();
  var logged=loggedSoFar(st);
  var totalElapsed=elapsedSec(st);
  var openDur=Math.max(0,totalElapsed-logged);
  var segments=st.gameLog.map(function(g){return g;});
  if(openDur>0.5) segments.push({name:'Final game',durationSec:openDur,startedAt:now-openDur*1000,endedAt:now,open:true});
  var gTotal=segments.reduce(function(a,seg){return a+costForDuration(st,rateAt(st,new Date(seg.startedAt)),seg.durationSec);},0);
  var cTotal=canteenTotal(st), grand=gTotal+cTotal;
  var advance=st.bookingAdvance||0;

  var tabPaidOff=0;
  var tabDeductionLines='';
  segments.forEach(function(seg,i){
    if(seg.paidOffByTab && seg.customerTabId){
      var ct=state.customerTabs.find(function(t){return t.id===seg.customerTabId;});
      var segCost=costForDuration(st,rateAt(st,new Date(seg.startedAt)),seg.durationSec);
      tabPaidOff+=segCost;
      tabDeductionLines+='<div class="line" style="color:var(--ok);"><span>Game '+(i+1)+' — '+seg.name+' (paid by '+(ct?ct.name:'tab')+')</span><span>-'+fmtMoney(segCost)+'</span></div>';
    }
  });

  var netGrand=Math.max(0,grand-advance-tabPaidOff);
  var invoiceNo=100000+state.invoiceCounter;
  var startD=new Date(st.startTime), endD=new Date(now);

  var breakdownHtml='';
  if(st.gameLog.length){
    breakdownHtml+='<hr>';
    segments.forEach(function(seg,i){
      var cost=costForDuration(st,rateAt(st,new Date(seg.startedAt)),seg.durationSec);
      var paidTag = seg.paidOffByTab ? ' <span style="color:var(--ok);font-size:11px;">(paid off)</span>' : '';
      breakdownHtml+='<div class="line"><span>Game '+(i+1)+' — '+seg.name+paidTag+'</span><span>'+fmtDur(seg.durationSec)+' · '+fmtMoney(cost)+'</span></div>';
    });
  }

  var deductionsHtml='';
  if(advance>0){
    deductionsHtml+='<div class="line"><span>Advance already paid</span><span>-'+fmtMoney(advance)+'</span></div>';
  }
  if(tabPaidOff>0){
    deductionsHtml+=tabDeductionLines;
    deductionsHtml+='<div class="line"><span>Total paid off via customer tabs</span><span>-'+fmtMoney(tabPaidOff)+'</span></div>';
  }
  if(deductionsHtml){
    deductionsHtml+='<hr><div class="line" style="font-weight:600;font-size:15px;"><span>Net payable</span><span>'+fmtMoney(netGrand)+'</span></div>';
  }

  var html='<div class="cp-bill">'+
    '<div class="line"><span>Bill No</span><span>#SS-'+invoiceNo+'</span></div>'+
    '<div class="line"><span>Date</span><span>'+startD.toLocaleDateString()+'</span></div>'+
    '<div class="line"><span>Table / Station</span><span>'+st.name+' ('+st.category+')</span></div>'+
    '<div class="line"><span>Start → End</span><span>'+fmtTime12(startD)+' → '+fmtTime12(endD)+'</span></div>'+
    '<div class="line"><span>Total play time</span><span>'+fmtDur(totalElapsed)+'</span></div>'+
    breakdownHtml+
    '<hr><div class="line"><span>Total game charges</span><span>'+fmtMoney(gTotal)+'</span></div>'+
    '<div class="line"><span>Canteen</span><span>'+fmtMoney(cTotal)+'</span></div>'+
    '<hr><div class="line" style="font-weight:600;font-size:15px;"><span>Grand total</span><span>'+fmtMoney(grand)+'</span></div>'+
    deductionsHtml+'</div>'+
    '<div class="cp-split" style="margin-top:14px;"><div class="cp-field"><label>Cash (PKR)</label><input id="mCash" type="number" value="'+Math.round(netGrand)+'"></div>'+
    '<div class="cp-field"><label>Online (PKR)</label><input id="mOnline" type="number" value="0"></div></div>'+
    '<div class="cp-field" style="margin-top:4px;"><label>Cash received from customer (PKR)</label><input id="mCashReceived" type="number" value="'+Math.round(netGrand)+'" placeholder="Actual cash handed over"></div>'+
    '<div class="cp-sub" id="mVarianceHint" style="margin-top:2px;margin-bottom:8px;"></div>'+
    '<div class="cp-field"><label>Customer name (for khata / advance ledger, optional)</label><input id="mKhata" placeholder="Leave blank if fully settled, no ledger" value="'+(st.bookingCustomerName||'')+'"></div>'+
    '<button class="cp-btn ghost" id="mPrintBtn" style="width:100%;margin-bottom:8px;">Print receipt</button>';

  showModal('Settle & close — '+st.name,html,function(){
    var cash=+document.getElementById('mCash').value||0, online=+document.getElementById('mOnline').value||0;
    var cashReceived=+document.getElementById('mCashReceived').value||0;
    var cashVariance=cashReceived-cash;
    var khName=document.getElementById('mKhata').value.trim();
    var remaining=Math.round(Math.max(0,netGrand-cash-online));
    var overpaid=Math.round(Math.max(0,(cash+online)-netGrand));
    var khStatus='none';
    if(remaining>=1 && khName){
      khStatus=requestOrGrantKhata(khName,'',remaining,st.name+' session');
    } else if(overpaid>=1 && khName){
      findOrCreateCustomer(khName,'').paid+=overpaid;
      khStatus='advance';
    }
    state.invoiceCounter++;
    state.sales.push({id:'s'+Date.now(),invoiceNo:invoiceNo,station:st.name,customer:st.customer,
      start:st.startTime,end:now,duration:totalElapsed,gameTotal:gTotal,canteenTotal:cTotal,total:grand,
      advancePaid:advance,tabPaidOff:tabPaidOff,netTotal:netGrand,
      cash:cash,online:online,cashReceived:cashReceived,cashVariance:cashVariance,
      khata:remaining>0?remaining:0,khataStatus:khStatus,games:segments});
    st.status='idle'; st.startTime=null; st.customer=''; st.orders=[]; st.gameLog=[]; st.pausedMs=0; st.pauseStart=null;
    st.bookingId=null; st.bookingAdvance=0; st.bookingCustomerName=''; st.bookingCustomerPhone='';
    saveState(); closeModal(); render();
    if(khStatus==='pending') alert('Sent to '+khName+' for admin approval — Rs. '+Math.round(remaining)+' udhaar is pending until approved.');
    if(khStatus==='advance') alert('Rs. '+Math.round(overpaid)+' extra received — added as advance credit for '+khName+'.');
  },'Settle & close');

  /* live variance hint */
  function updateVarianceHint(){
    var c=+document.getElementById('mCash').value||0;
    var cr=+document.getElementById('mCashReceived').value||0;
    var diff=cr-c;
    var hint=document.getElementById('mVarianceHint');
    if(!hint) return;
    if(diff===0) hint.textContent='';
    else if(diff>0) hint.innerHTML='<span style="color:var(--ok);">+'+fmtMoney(diff)+' excess (staff ne zyada liye)</span>';
    else hint.innerHTML='<span style="color:var(--danger);">'+fmtMoney(diff)+' shortage (staff ne kam liye)</span>';
  }
  var mCashEl=document.getElementById('mCash');
  var mCREl=document.getElementById('mCashReceived');
  if(mCashEl) mCashEl.oninput=updateVarianceHint;
  if(mCREl) mCREl.oninput=updateVarianceHint;
  updateVarianceHint();

  var printBtn=document.getElementById('mPrintBtn');
  if(printBtn) printBtn.onclick=function(){
    var receiptInner='<h2>STRIKE & SERVE</h2><div class="center">Club & Gaming Lounge POS</div><hr>'+
      '<div class="line"><span>Bill No</span><span>#SS-'+invoiceNo+'</span></div>'+
      '<div class="line"><span>Date</span><span>'+startD.toLocaleDateString()+'</span></div><hr>'+
      '<div class="line"><span>Table</span><span>'+st.name+' ('+st.category+')</span></div>'+
      '<div class="line"><span>Start → End</span><span>'+fmtTime12(startD)+' → '+fmtTime12(endD)+'</span></div>'+
      '<div class="line"><span>Play time</span><span>'+fmtDur(totalElapsed)+'</span></div>'+
      breakdownHtml+
      '<hr><div class="line"><span>Game charges</span><span>'+fmtMoney(gTotal)+'</span></div>'+
      '<div class="line"><span>Canteen</span><span>'+fmtMoney(cTotal)+'</span></div>'+
      '<hr><div class="line" style="font-weight:700;"><span>GRAND TOTAL</span><span>'+fmtMoney(grand)+'</span></div><hr>'+
      '<div class="center">THANK YOU FOR PLAYING!</div><div class="center">Powered by Royal Snooker Academy POS</div>';
    printReceiptHtml(receiptInner);
  };
}

function renderKhata(body){
  var row=el('div','cp-row');
  row.appendChild(el('h2','cp-h2','Customer khata & udhaar'));
  var addBtn=el('button','cp-btn brass','+ Add entry');
  addBtn.onclick=openAddKhata;
  row.appendChild(addBtn);
  body.appendChild(row);

  var totalPending=state.khata.reduce(function(a,k){return a+Math.max(0,k.given-k.paid);},0);
  var totalAdvance=state.khata.reduce(function(a,k){return a+Math.max(0,k.paid-k.given);},0);
  var totalAwaiting=state.khataRequests.filter(function(r){return r.status==='pending';}).reduce(function(a,r){return a+r.amount;},0);
  var m=el('div','cp-metrics');
  m.appendChild(el('div','cp-metric','<b>'+fmtMoney(totalPending)+'</b><span>Total pending udhaar</span>'));
  m.appendChild(el('div','cp-metric','<b>'+fmtMoney(totalAdvance)+'</b><span>Total advance held</span>'));
  m.appendChild(el('div','cp-metric','<b>'+fmtMoney(totalAwaiting)+'</b><span>Awaiting admin approval</span>'));
  body.appendChild(m);

  if(totalAwaiting>0){
    body.appendChild(el('div','cp-note','Some udhaar requests need admin approval before they count against a customer\u2019s balance.'));
  }

  if(!state.khata.length){ body.appendChild(el('div','cp-empty','No khata entries yet.')); return; }
  state.khata.forEach(function(k){
    var bal=k.given-k.paid;
    var item=el('div','cp-list-item','<div>'+k.name+'<div class="cp-sub">'+(k.phone||'no phone')+'</div></div>');
    var tagHtml;
    if(bal>0) tagHtml='<span class="cp-tag" style="color:#A83232;background:#FBEAEA;">'+fmtMoney(bal)+' due</span>';
    else if(bal<0) tagHtml='<span class="cp-tag" style="color:#3E7D4B;background:#E6F2E8;">'+fmtMoney(-bal)+' advance</span>';
    else tagHtml='<span class="cp-tag">cleared</span>';
    var right=el('div','',tagHtml);
    item.appendChild(right);
    if(bal>0){
      var payBtn=el('button','cp-btn ghost',"Receive");
      payBtn.style.marginLeft='8px'; payBtn.style.padding='5px 10px'; payBtn.style.fontSize='12px';
      payBtn.onclick=function(){
        var amt=prompt('Amount received from '+k.name+' (balance '+fmtMoney(bal)+'):');
        if(amt){ k.paid+=Math.min(bal,+amt||0); saveState(); render(); }
      };
      item.appendChild(payBtn);
    }
    body.appendChild(item);
  });
}

function renderHistory(body){

    else varSummary.innerHTML='<b>Rs. 0</b><span>No net variance</span>';

    variances.slice().reverse().forEach(function(s){
      var v=s.cashVariance;
      var tagStyle = v>0 ? 'color:var(--ok);background:#E6F2E8;' : 'color:var(--danger);background:#FBEAEA;';

        '<span class="cp-tag" style="'+tagStyle+'">'+tagText+'</span>');
      body.appendChild(item);
    });

  state.sales.slice().reverse().forEach(function(s){
    var varTag='';

      var vs=s.cashVariance;
      varTag = vs>0 ? ' <span class="cp-tag" style="color:var(--ok);background:#E6F2E8;font-size:10px;">+'+fmtMoney(vs)+'</span>'
        : ' <span class="cp-tag" style="color:var(--danger);background:#FBEAEA;font-size:10px;">'+fmtMoney(vs)+'</span>';

      '<span class="cp-tag">'+fmtMoney(s.total)+'</span>'+varTag);

  });

      });

  var cashFromSales=cashFromSalesSince(reg.current.openedAt);

  var cashDeduct=registerCashDeductions();
  var onlineDeduct=registerOnlineDeductions();

  m.appendChild(el('div','cp-metric','<b>'+fmtMoney(cashFromSales)+' / '+fmtMoney(onlineFromSales)+'</b><span>From sales (cash / online)</span>'));
  body.appendChild(m);

  var actionRow=el('div','cp-cardbtns');
  var expBtn=el('button','cp-btn ghost','+ Expense / purchase');
  expBtn.onclick=openRegisterExpense;
  var wdBtn=el('button','cp-btn ghost','+ Owner withdrawal');
  wdBtn.onclick=openRegisterWithdrawal;
  var closeBtn=el('button','cp-btn danger','Close register (day close)');
  closeBtn.style.flex='1 1 100%';
  closeBtn.onclick=openRegisterClose;
  actionRow.appendChild(expBtn); actionRow.appendChild(wdBtn); actionRow.appendChild(closeBtn);
  body.appendChild(actionRow);

  if(reg.current.entries.length){
    body.appendChild(el('h2','cp-h2','Today\'s entries'));
    reg.current.entries.slice().reverse().forEach(function(e){
      var typeLabel = e.type==='withdrawal' ? 'Owner withdrawal' : (e.type==='purchase'?'Purchase':'Expense');
      var item=el('div','cp-list-item','<div>'+typeLabel+(e.note?(' — '+e.note):'')+'<div class="cp-sub">'+e.mode+' · '+new Date(e.createdAt).toLocaleTimeString()+'</div></div>'+
        '<span class="cp-tag" style="color:var(--danger);background:#FBEAEA;">-'+fmtMoney(e.amount)+'</span>');
      body.appendChild(item);
    });
  }
}

function openRegisterClose(){
  var reg=state.register;
  var cashFromSales=cashFromSalesSince(reg.current.openedAt);
  var onlineFromSales=onlineFromSalesSince(reg.current.openedAt);
  var cashDeduct=registerCashDeductions();
  var onlineDeduct=registerOnlineDeductions();
  var cashSystem=reg.current.cashOpening+cashFromSales-cashDeduct;
  var onlineSystem=reg.current.onlineOpening+onlineFromSales-onlineDeduct;

  var denomHtml='<div class="cp-sub" style="margin-bottom:8px;">Physical cash count — denomination-wise</div><div class="cp-split" style="flex-wrap:wrap;">';
  DENOMS.forEach(function(d){
    denomHtml+='<div class="cp-field" style="flex:1 1 30%;min-width:88px;"><label>Rs. '+d+' notes</label><input class="mDenom" data-d="'+d+'" type="number" min="0" value="0"></div>';
  });
  denomHtml+='</div><div class="cp-sub" id="mDenomTotal" style="font-weight:600;margin:8px 0;">Physical total: Rs. 0</div>';

  var html='<div class="cp-bill">'+
    '<div class="line"><span>System cash balance</span><span>'+fmtMoney(cashSystem)+'</span></div>'+
    '<div class="line"><span>System online balance</span><span>'+fmtMoney(onlineSystem)+'</span></div></div>'+
    denomHtml+
    '<div class="cp-field"><label>Online closing (PKR, editable if needed)</label><input id="mOnlineClose" type="number" value="'+Math.round(onlineSystem)+'"></div>'+
    '<div class="cp-sub" id="mVarianceLine" style="font-weight:600;"></div>';

  showModal('Close register — day close',html,function(){
    var total=0;
    document.querySelectorAll('.mDenom').forEach(function(inp){ total+=(+inp.value||0)*(+inp.getAttribute('data-d')); });
    var onlineClose=+document.getElementById('mOnlineClose').value||0;
    var variance=total-cashSystem;
    var denomCounts={};
    document.querySelectorAll('.mDenom').forEach(function(inp){ denomCounts[inp.getAttribute('data-d')]=+inp.value||0; });
    state.register.history.push({id:'r'+Date.now(),openedAt:reg.current.openedAt,closedAt:Date.now(),
      cashOpening:reg.current.cashOpening,onlineOpening:reg.current.onlineOpening,
      cashFromSales:cashFromSales,onlineFromSales:onlineFromSales,
      cashDeductions:cashDeduct,onlineDeductions:onlineDeduct,
      cashSystemBalance:cashSystem,onlineSystemBalance:onlineSystem,
      cashPhysicalClosing:total,onlineClosing:onlineClose,variance:variance,
      denominations:denomCounts,entries:reg.current.entries});
    state.register.current=null;
    saveState(); closeModal(); render();
  },'Confirm closing');

  function recalc(){
    var total=0;
    document.querySelectorAll('.mDenom').forEach(function(inp){ total+=(+inp.value||0)*(+inp.getAttribute('data-d')); });
    var totalEl=document.getElementById('mDenomTotal');
    if(totalEl) totalEl.textContent='Physical total: '+fmtMoney(total);
    var variance=total-cashSystem;
    var vEl=document.getElementById('mVarianceLine');
    if(!vEl) return;
    if(variance===0) vEl.innerHTML='Matched — no difference.';
    else if(variance>0) vEl.innerHTML='<span style="color:var(--ok);">Over by '+fmtMoney(variance)+'</span>';
    else vEl.innerHTML='<span style="color:var(--danger);">Short by '+fmtMoney(Math.abs(variance))+'</span>';
  }
  document.querySelectorAll('.mDenom').forEach(function(inp){ inp.addEventListener('input',recalc); });
  recalc();
}

function openSettleCustomerTab(tabId){
  var ct=state.customerTabs.find(function(t){return t.id===tabId;});
  if(!ct) return;
  var totalCost=ct.games.reduce(function(a,g){return a+g.cost;},0);
  var breakdownHtml='';
  ct.games.forEach(function(g,i){
    breakdownHtml+='<div class="line"><span>'+(i+1)+'. '+g.stationName+' — '+g.gameName+'</span><span>'+fmtDur(g.durationSec)+' · '+fmtMoney(g.cost)+'</span></div>';
  });
  var html='<div class="cp-bill">'+
    '<div class="line"><span>Customer</span><span>'+ct.name+'</span></div>'+
    '<div class="line"><span>Total games</span><span>'+ct.games.length+'</span></div>'+
    breakdownHtml+
    '<hr><div class="line" style="font-weight:600;font-size:15px;"><span>Total payable</span><span>'+fmtMoney(totalCost)+'</span></div></div>'+
    '<div class="cp-split" style="margin-top:14px;"><div class="cp-field"><label>Cash (PKR)</label><input id="mTabCash" type="number" value="'+Math.round(totalCost)+'"></div>'+
    '<div class="cp-field"><label>Online (PKR)</label><input id="mTabOnline" type="number" value="0"></div></div>';

  showModal('Settle tab — '+ct.name,html,function(){
    var cash=+document.getElementById('mTabCash').value||0;
    var online=+document.getElementById('mTabOnline').value||0;
    ct.status='settled';
    ct.settledAt=Date.now();
    ct.totalPaid=cash+online;
    ct.games.forEach(function(g){
      var station=state.stations.find(function(s){return s.id===g.stationId;});
      if(station && station.gameLog){
        var match=station.gameLog.find(function(gl){return gl.customerTabId===ct.id && gl.startedAt===g.startedAt;});
        if(match) match.paidOffByTab=true;
      }
    });
    var remaining=Math.round(Math.max(0,totalCost-cash-online));
    if(remaining>=1){
      requestOrGrantKhata(ct.name,ct.phone||'',remaining,'Customer tab settle — remaining balance');
    }
    saveState(); closeModal(); render();
    if(remaining>=1) alert(ct.name+' ka tab settle hua — Rs. '+remaining+' udhaar khata mein add hua.');
    else alert(ct.name+' ka tab fully settled — '+fmtMoney(cash+online)+' received. Ye amount in tables ke bills se minus ho jayega.');
  },'Settle & close tab');
}

function openManualLinkGame(tabId){
  var ct=state.customerTabs.find(function(t){return t.id===tabId;});
  if(!ct) return;
  var runningStations=state.stations.filter(function(s){return s.status==='running' && s.gameLog.length>0;});
  if(!runningStations.length){ alert('Koi table chal nahi raha jis pe game log ho.'); return; }
  var html='<div class="cp-sub" style="margin-bottom:10px;">Select a completed game from a running table to link to '+ct.name+'\'s tab:</div>';
  runningStations.forEach(function(st){
    st.gameLog.forEach(function(g,i){
      if(g.customerTabId) return;
      var cost=costForDuration(st,rateAt(st,new Date(g.startedAt)),g.durationSec);
      html+='<div class="cp-list-item" style="cursor:pointer;" data-sid="'+st.id+'" data-gi="'+i+'">'+
        '<div>'+st.name+' — Game '+(i+1)+' ('+g.name+')<div class="cp-sub">'+fmtDur(g.durationSec)+' · '+fmtMoney(cost)+'</div></div>'+
        '<input type="checkbox" class="mLinkChk" data-sid="'+st.id+'" data-gi="'+i+'" style="width:auto;"></div>';
    });
  });
  showModal('Link games to '+ct.name+'\'s tab',html,function(){
    document.querySelectorAll('.mLinkChk:checked').forEach(function(chk){
      var sid=chk.getAttribute('data-sid');
      var gi=+chk.getAttribute('data-gi');
      var station=state.stations.find(function(s){return s.id===sid;});
      if(!station) return;
      var g=station.gameLog[gi];
      if(!g || g.customerTabId) return;
      var cost=costForDuration(station,rateAt(station,new Date(g.startedAt)),g.durationSec);
      g.customerTabId=ct.id;
      ct.games.push({stationId:station.id,stationName:station.name,gameName:g.name,durationSec:g.durationSec,cost:cost,startedAt:g.startedAt,endedAt:g.endedAt,gameIndex:gi});
    });
    saveState(); closeModal(); render();
  },'Link selected games');
}

function waLink(phone,msg){
  var digits=(phone||'').replace(/[^\d]/g,'');
  if(digits.indexOf('0')===0) digits='92'+digits.slice(1);
  else if(digits.indexOf('92')!==0) digits='92'+digits;
  return 'https://wa.me/'+digits+'?text='+encodeURIComponent(msg);
}

  var options=idle.map(function(s){return '<option value="'+s.id+'">'+s.name+' ('+s.category+')</option>';}).join('');
  showModal('Allot table — '+bk.name,
    '<div class="cp-sub" style="margin-bottom:10px;">Booking: '+(bk.category||'')+' · '+(bk.date||'')+' '+(bk.time||'')+(bk.advanceAmount?(' · Advance paid: '+fmtMoney(bk.advanceAmount)):'')+'</div>'+
    '<div class="cp-field"><label>Select table to allot</label><select id="mAllotStation">'+options+'</select></div>'+
    '<div class="cp-field" id="mAllotModeWrap" style="display:none;"><label>Bill this session by</label><select id="mAllotMode"><option value="min">Per minute</option><option value="hour">Per hour</option></select></div>',
    function(){
      var stId=document.getElementById('mAllotStation').value;
      var st=state.stations.find(function(s){return s.id===stId;});
      if(!st) return;
      if(st.mode==='both'){ st.sessionMode=document.getElementById('mAllotMode').value; }
      st.customer=bk.name;
      st.status='running'; st.startTime=Date.now(); st.orders=[]; st.gameLog=[]; st.pausedMs=0; st.pauseStart=null;
      st.bookingId=bk.id; st.bookingAdvance=bk.advanceAmount||0; st.bookingCustomerName=bk.name; st.bookingCustomerPhone=bk.phone||'';
      bk.consumed=true; bk.linkedStationId=st.id;
      saveState(); saveBookings(); closeModal(); render();
    },'Start & allot table');
  var selEl=document.getElementById('mAllotStation');
  function syncModeVisibility(){
    var chosen=state.stations.find(function(s){return s.id===selEl.value;});
    document.getElementById('mAllotModeWrap').style.display=(chosen && chosen.mode==='both')?'block':'none';
  }
  if(selEl){ selEl.onchange=syncModeVisibility; syncModeVisibility(); }
}
function renderBookings(body){
  var row=el('div','cp-row');
  row.appendChild(el('h2','cp-h2','Booking requests'));
  var refreshBtn=el('button','cp-btn ghost','Refresh');
  refreshBtn.onclick=function(){ loadBookings().then(render); };
  row.appendChild(refreshBtn);
  body.appendChild(row);
  body.appendChild(el('div','cp-note','Customers submit these from the separate Booking page with a payment screenshot. Approve to confirm — a WhatsApp message link opens ready to send.'));

  var pending=bookings.filter(function(b){return b.status==='pending';});
  var others=bookings.filter(function(b){return b.status!=='pending';});

  if(!bookings.length){ body.appendChild(el('div','cp-empty','No booking requests yet.')); return; }

  function bookingCard(b){
    var card=el('div','cp-card'); card.style.marginBottom='10px';
    if(!b.notifRead) card.style.borderColor='var(--brass)';
    var head=el('div','',
      '<div class="cp-tname">'+b.name+(!b.notifRead?' <span class="cp-tag" style="color:var(--brass);background:#FBF3E4;">new</span>':'')+'</div>'+
      '<div class="cp-cat">'+(b.category||'')+' · '+(b.date||'no date')+' '+(b.time||'')+'</div>');
    card.appendChild(head);
    card.appendChild(el('div','cp-sub','Phone: '+b.phone+(b.notes?(' · '+b.notes):'')+(b.advanceAmount?(' · Advance: '+fmtMoney(b.advanceAmount)):'')));
    if(b.screenshot||b.hasScreenshot){
      var imgWrap=el('div','','<div class="cp-sub" style="margin-top:8px;">Loading screenshot...</div>');
      card.appendChild(imgWrap);
      if(b.screenshot){
        imgWrap.innerHTML='';
        var img=el('img',''); img.src=b.screenshot;
        img.style.cssText='max-width:100%;border-radius:8px;margin-top:8px;max-height:220px;object-fit:contain;background:#F0EAD9;';
        imgWrap.appendChild(img);
      } else {
        db.ref('booking-screenshots/'+b.id).once('value').then(function(snap){
          var data=snap.val();
          imgWrap.innerHTML='';
          if(data){
            var img=el('img',''); img.src=data;
            img.style.cssText='max-width:100%;border-radius:8px;margin-top:8px;max-height:220px;object-fit:contain;background:#F0EAD9;';
            imgWrap.appendChild(img);
          } else { imgWrap.innerHTML='<div class="cp-sub" style="margin-top:8px;">Screenshot not available</div>'; }
        }).catch(function(){ imgWrap.innerHTML=''; });
      }
    }
    var statusTag = b.status==='approved' ? '<span class="cp-tag" style="color:var(--ok);background:#E6F2E8;">confirmed</span>'
      : b.status==='rejected' ? '<span class="cp-tag" style="color:var(--danger);background:#FBEAEA;">rejected</span>'
      : '<span class="cp-tag">awaiting approval</span>';
    var statusRow=el('div',''); statusRow.style.marginTop='8px'; statusRow.innerHTML=statusTag;
    card.appendChild(statusRow);

    if(b.status==='pending' && role==='admin'){
      var btns=el('div','cp-cardbtns');
      var okBtn=el('button','cp-btn','Approve');
      okBtn.onclick=function(){
        b.status='approved'; b.notifRead=true;
        if(b.advanceAmount>0){ findOrCreateCustomer(b.name,b.phone).paid+=b.advanceAmount; saveState(); }
        saveBookings();
        render();
        var msg='Assalam-o-Alaikum '+b.name+'! Aap ki booking Royal Snooker Academy mein confirm ho gayi hai — '+(b.category||'table')+' '+(b.date||'')+' '+(b.time||'')+'. Shukriya!';
        window.open(waLink(b.phone,msg),'_blank');
      };
      var noBtn=el('button','cp-btn danger','Reject');
      noBtn.onclick=function(){ b.status='rejected'; b.notifRead=true; saveBookings(); render(); };
      btns.appendChild(okBtn); btns.appendChild(noBtn);
      card.appendChild(btns);
    } else if(b.status==='approved' && !b.consumed){
      var allotBtns=el('div','cp-cardbtns');
      var waBtn2=el('button','cp-btn brass','WhatsApp');
      waBtn2.onclick=function(){
        var msg='Assalam-o-Alaikum '+b.name+'! Aap ki booking Royal Snooker Academy mein confirm ho gayi hai — '+(b.category||'table')+' '+(b.date||'')+' '+(b.time||'')+'. Shukriya!';
        window.open(waLink(b.phone,msg),'_blank');
      };
      var startBtn=el('button','cp-btn','Start session');
      startBtn.onclick=function(){ openAllotBooking(b.id); };
      allotBtns.appendChild(waBtn2); allotBtns.appendChild(startBtn);
      card.appendChild(allotBtns);
    } else if(b.status==='approved' && b.consumed){
      var linkedSt=state.stations.find(function(s){return s.id===b.linkedStationId;});
      card.appendChild(el('div','cp-sub','Seated at '+(linkedSt?linkedSt.name:'a table')+' — advance adjusted at settle.'));
    } else if(b.status==='pending' && role!=='admin'){
      card.appendChild(el('div','cp-sub','Waiting for admin to review this request.'));
    }
    return card;
  }

  pending.forEach(function(b){ body.appendChild(bookingCard(b)); });
  others.forEach(function(b){ body.appendChild(bookingCard(b)); });
}

function showModal(title,bodyHtml,onSave,saveLabel){
  var ov=el('div','cp-overlay'); ov.id='cpOverlay';
  var modal=el('div','cp-modal');
  var head=el('div','cp-modal-head','<h3>'+title+'</h3>');
  var x=el('button','cp-x','&times;'); x.onclick=closeModal;
  head.appendChild(x);
  modal.appendChild(head);
  var b=el('div',''); b.innerHTML=bodyHtml; modal.appendChild(b);
  var save=el('button','cp-btn',saveLabel||'Save'); save.style.width='100%'; save.style.marginTop='10px'; save.style.padding='11px';
  save.onclick=onSave;
  modal.appendChild(save);
  ov.appendChild(modal);
  ov.onclick=function(e){ if(e.target===ov) closeModal(); };
  document.getElementById('cpApp').appendChild(ov);
}
function closeModal(){ var ov=document.getElementById('cpOverlay'); if(ov) ov.remove(); }

loadState();
})();

</script>
</body>
